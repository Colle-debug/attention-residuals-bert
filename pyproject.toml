[project]
name = "attn-res-bert"
version = "0.1.0"
description = "A from-scratch PyTorch benchmark comparing Attention Residuals (Kimi Team) against a standard PreNorm residual baseline, inside an 8-layer BERT-Medium encoder trained on masked language modeling over WikiText-103"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=2.19",
    "matplotlib>=3.11.1",
    "numpy>=1.24",
    "tokenizers>=0.19",
    "torch>=2.1",
    "transformers>=4.40",
]
